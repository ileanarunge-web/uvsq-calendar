name: Update Calendar

on:
  schedule:
    - cron: '0 0 * * *'   # tous les jours à minuit UTC
  workflow_dispatch:       # permet de lancer à la main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - group: DFASM1
            output: emploi_dfasm1.ics
          - group: DFASM2
            output: emploi_dfasm2.ics
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests ics
      - name: Generate ICS for ${{ matrix.group }}
        run: python main.py ${{ matrix.group }} ${{ matrix.output }} 
      - name: Commit and push
        run: |
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add ${{ matrix.output }}
          git commit -m 'Update ${{ matrix.output }}' || echo 'No changes to commit'
          git pull --rebase
          git push
